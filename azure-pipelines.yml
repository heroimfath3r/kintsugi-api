trigger:
  - main

pool:
  name: 'local'

steps:
  # ============================================
  # FASE A: Configuración del entorno
  # ============================================
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Instalar Node.js 20.x'

  - script: |
      npm install
    displayName: 'Instalar dependencias'

  # ============================================
  # FASE C: Análisis de Composición de Software (SCA)
  # Escanea dependencias buscando vulnerabilidades CVE
  # ============================================
  - script: |
      echo === Analisis de dependencias SCA ===
      npm audit --audit-level=high
    displayName: 'Analisis de dependencias - npm audit (SCA)'
    continueOnError: true

  # ============================================
  # FASE B: Análisis de Seguridad Estático (SAST)
  # Detecta patrones de riesgo en el código fuente
  # ============================================
  - script: |
      echo === Analisis de seguridad estatico SAST ===
      echo Buscando patrones de riesgo: eval, exec, innerHTML, SQL injection...
      findstr /S /I /N "eval(" src\*.js && echo [ADVERTENCIA] Se encontro uso de eval || echo [OK] No se encontro eval
      findstr /S /I /N "child_process" src\*.js && echo [ADVERTENCIA] Se encontro child_process || echo [OK] No se encontro child_process
      findstr /S /I /N "innerHTML" src\*.js && echo [ADVERTENCIA] Se encontro innerHTML || echo [OK] No se encontro innerHTML
      findstr /S /I /N "exec(" src\*.js && echo [ADVERTENCIA] Se encontro exec || echo [OK] No se encontro exec
      findstr /S /I /N "SELECT.*FROM" src\*.js && echo [ADVERTENCIA] Posible SQL sin parametrizar || echo [OK] No se encontro SQL directo
      echo === Analisis SAST completado ===
    displayName: 'Analisis de seguridad estatico (SAST)'
    continueOnError: true

  # ============================================
  # FASE D: Pruebas Automatizadas
  # Ejecuta tests unitarios con Jest
  # ============================================
  - script: |
      set NODE_ENV=test
      npm test
    displayName: 'Ejecutar pruebas unitarias'

  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/junit.xml'
      mergeTestResults: true
      testRunTitle: 'Kintsugi API - Pruebas Unitarias'
    displayName: 'Publicar resultados de pruebas'
    condition: always()

  # ============================================
  # FASE D: Generación de Artefacto Inmutable
  # Empaqueta el código verificado en un .zip
  # ============================================
  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/kintsugi-api-$(Build.BuildId).zip'
    displayName: 'Empaquetar artefacto inmutable (.zip)'

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'drop'
    displayName: 'Publicar artefacto en Azure DevOps'